name: Train and release ONNX model

on:
  workflow_dispatch:
    inputs:
      market:
        description: Binance market
        required: true
        type: choice
        options: [usdm, spot]
      interval:
        description: Candle interval
        required: true
        type: choice
        options: [1h, 4h, 1d]
      symbols:
        description: Comma-separated symbols, between 4 and 30
        required: true
        type: string
      start:
        description: Training start in ISO-8601 UTC
        required: true
        type: string
      end:
        description: Training end in ISO-8601 UTC; for USD-M use the first day of a month
        required: true
        type: string
      lookback:
        description: Feature lookback bars
        required: true
        default: "48"
        type: string
      horizon:
        description: Prediction holding horizon in bars
        required: true
        default: "8"
        type: string

permissions:
  contents: write

run-name: Train CoinSeek model ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Train, validate, and export ONNX
        env:
          MODEL_ID: run-${{ github.run_id }}-${{ github.run_attempt }}
          MARKET: ${{ inputs.market }}
          INTERVAL: ${{ inputs.interval }}
          SYMBOLS: ${{ inputs.symbols }}
          TRAIN_START: ${{ inputs.start }}
          TRAIN_END: ${{ inputs.end }}
          LOOKBACK: ${{ inputs.lookback }}
          HORIZON: ${{ inputs.horizon }}
        run: >-
          python -m coinseek_model.train
          --model-id "$MODEL_ID"
          --market "$MARKET"
          --interval "$INTERVAL"
          --symbols "$SYMBOLS"
          --start "$TRAIN_START"
          --end "$TRAIN_END"
          --lookback "$LOOKBACK"
          --horizon "$HORIZON"
      - name: Publish model files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_ID: run-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          gh release create "model-$MODEL_ID"
          model-output/model.onnx
          model-output/manifest.json
          --title "CoinSeek model $MODEL_ID"
          --notes "Validated ONNX model generated by workflow run ${{ github.run_id }} (attempt ${{ github.run_attempt }})."
