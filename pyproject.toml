[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coinseek-model"
version = "0.1.0"
description = "Train and export cross-sectional LightGBM models for CoinSeek"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "lightgbm==4.6.0",
  "numpy==2.2.6",
  "onnx==1.18.0",
  "onnxmltools==1.14.0",
  "onnxruntime==1.22.1",
  "skl2onnx==1.19.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
